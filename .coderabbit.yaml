# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Central CodeRabbit configuration for every tinkerologie repository that has
# no .coderabbit.yaml of its own. `inheritance: true` keeps the Organization UI
# settings (review profile, tools, etc.) for anything not set here. A repo that
# adds its own .coderabbit.yaml should also set `inheritance: true` to build on
# this file instead of replacing it.
inheritance: true

# Applies to reviews and chat, so it sets style only. Severity filtering for
# reviews lives in reviews.path_instructions. (Schema limit: 250 characters)
tone_instructions: >-
  Be concise and direct. Skip praise, filler, and restating what the diff
  already shows.

issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    # The org "Issue Type Labeler" workflow labels most issues instantly from
    # the template title prefix. CodeRabbit covers the ambiguous rest, and
    # honours the same opt-out labels (see GOVERNANCE.md).
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: >-
          Apply only when the issue has none of these labels: `bug`, `enhancement`,
          `question`, `duplicate`, `invalid`, `wontfix`, `no-type`.
          The issue reports a defect: something that worked or should work is broken,
          returns wrong or missing data, crashes, errors, hangs, or regressed.
      - label: enhancement
        instructions: >-
          Apply only when the issue has none of these labels: `bug`, `enhancement`,
          `question`, `duplicate`, `invalid`, `wontfix`, `no-type`.
          The issue asks for new functionality, new device or platform support, an
          option, a performance or test-coverage improvement, a refactor, or documentation.
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - bug
        - enhancement
        - "!no-plan"
        - "!duplicate"
        - "!invalid"
        - "!wontfix"

reviews:
  # Pinned here so the profile is versioned; it matches the Organization UI.
  profile: quiet

  # CodeRabbit requests changes until its comments are resolved and no
  # error-mode pre-merge check fails, then approves. The rulesets require no
  # approving reviews, so a change request does not block merging on its own.
  request_changes_workflow: true

  # Apply strict severity filtering across all files
  path_instructions:
    - path: "**/*"
      instructions: >-
        Focus exclusively on major and critical defects: logic bugs, unhandled
        exceptions, security vulnerabilities, memory/resource leaks, concurrency
        hazards, data loss, breaking changes, and regressions. Do not leave inline
        comments for minor code smells, stylistic preferences, variable naming,
        formatting, or micro-optimizations.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: warning
    custom_checks:
      # Warning, not error: an AI judgement should not block a merge. Codecov's
      # codecov/patch gate enforces coverage.
      - name: Tests cover changed code
        mode: warning
        instructions: >-
          Pass if the new or changed behaviour in non-test source files (new or
          changed functions and methods, new branches, and new error handling) is
          exercised by tests added or updated in this PR, or if the PR only changes
          documentation, CI configuration, metadata, dependency lock files, or
          generated files. Lines with no behaviour of their own (logging, imports,
          re-exports, type-only declarations, constants) do not need dedicated tests.
          Fail otherwise, and list each untested function or branch with its file
          path. This check complements Codecov's codecov/patch gate, which requires
          at least 90% of changed lines to be covered (some repositories set a
          higher target); never suggest lowering coverage targets or adding coverage
          ignore rules.
